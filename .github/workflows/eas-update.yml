name: EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      message:
        description: Update message
        required: true
        default: Update from GitHub Actions

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: eas update --channel "${{ inputs.channel }}" --message "${{ inputs.message }}" --non-interactive
